name: iOS Release (TestFlight)

# Manual only — an App Store Connect upload is not something we want to
# trigger on every push. Run it from the Actions tab when a release build
# is actually wanted.
#
# ─── Signing: MANUAL, from stored secrets (do NOT go back to
#     -allowProvisioningUpdates) ────────────────────────────────────────────
# The old "Automatic" flow let Xcode mint a fresh Apple Distribution
# certificate on every run. Each CI runner is ephemeral so the private key
# was thrown away each time and a new cert created the next — until the
# account hit "maximum number of certificates" and every archive failed.
#
# This workflow now imports a fixed cert + provisioning profile. Create the
# three secrets ONCE (on a Mac):
#
#   # 1. Apple Distribution cert + private key -> base64 .p12
#   #    (Keychain Access -> your "Apple Distribution: ..." identity ->
#   #     right-click -> Export -> .p12 with a password)
#   base64 -i dist.p12 | pbcopy                  # -> secret IOS_DIST_CERT_P12
#   #    the password you set                     -> secret IOS_DIST_CERT_PASSWORD
#
#   # 2. App Store provisioning profile for com.translate.livekit.livekitTranslate
#   #    (developer.apple.com -> Profiles -> + -> App Store -> download .mobileprovision)
#   base64 -i Swayco_AppStore.mobileprovision | pbcopy   # -> secret IOS_PROVISIONING_PROFILE
#
# Settings -> Secrets and variables -> Actions -> New repository secret.
# APP_STORE_CONNECT_API_KEY_P8 is still required — but ONLY for the final
# upload to App Store Connect, it never creates certificates.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Marketing version override (e.g. 6.1.9). Leave empty to use pubspec.yaml."
        required: false
        type: string
      build_number:
        description: "Build number override (e.g. 173). Leave empty to use pubspec.yaml."
        required: false
        type: string
      upload_to_testflight:
        description: "Upload the build to App Store Connect / TestFlight"
        required: false
        type: boolean
        default: true

env:
  APPLE_TEAM_ID: VXYW3LN267
  ASC_KEY_ID: 69CRTT22QQ
  ASC_ISSUER_ID: 2a9d2e9a-c1a1-4a7f-b390-8638f7f8b751
  BUNDLE_ID: com.translate.livekit.livekitTranslate
  FLUTTER_VERSION: 3.41.2
  # Same public/non-secret values already committed in build-release.ps1 —
  # Supabase publishable key and Google client IDs are meant to ship
  # inside the client binary, they are not credentials.
  SUPABASE_URL: https://rhxenzcdnfvpgjjefztx.supabase.co
  SUPABASE_PUBLISHABLE_KEY: sb_publishable_5NZJowDX1ba6cGwuzFN08Q_j9GxFMXi
  TOKEN_API_BASE: https://www.swayco.fr
  GOOGLE_WEB_CLIENT_ID: 361554699132-vjspl0l68h93fg9vateiinb1ndboj4ge.apps.googleusercontent.com
  GOOGLE_IOS_CLIENT_ID: 361554699132-7864a6b9g008r6do0gekdh4ddftcul48.apps.googleusercontent.com

jobs:
  build-and-release:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      # Fail fast, with an explicit message, before spending any runner time.
      - name: Verify required secrets are configured
        env:
          ASC_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          missing=""
          [ -z "$ASC_P8" ]     && missing="$missing APP_STORE_CONNECT_API_KEY_P8"
          [ -z "$CERT_P12" ]   && missing="$missing IOS_DIST_CERT_P12"
          [ -z "$CERT_PW" ]    && missing="$missing IOS_DIST_CERT_PASSWORD"
          [ -z "$PROFILE_B64" ] && missing="$missing IOS_PROVISIONING_PROFILE"
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub secret(s):$missing . See the comment block at the top of .github/workflows/ios-release.yml for how to create the signing secrets. Add them under Settings -> Secrets and variables -> Actions, then re-run."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      # macos-15's default Xcode (16.4) predates the iOS 26 "Liquid Glass"
      # APIs (.glassEffect, GlassEffectContainer, UIButton.Configuration.glass,
      # NWPath.isUltraConstrained, ...) that cupertino_native_plus compiles
      # against. Select the newest Xcode 26.x the image has installed instead
      # of hardcoding a patch version, since GitHub bumps these over time.
      - name: Select Xcode 26
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner image. cupertino_native_plus needs the iOS 26 SDK. Check https://github.com/actions/runner-images for the current macos-15 Xcode list."
            exit 1
          fi
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version

      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install Dart dependencies
        run: flutter pub get

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install --repo-update

      - name: Decode App Store Connect API key
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          KEY_PATH="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}" | base64 --decode > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "ASC_KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"

      # Import the FIXED signing cert + profile into a throwaway keychain.
      # No -allowProvisioningUpdates anywhere -> Xcode never creates a cert.
      - name: Import signing certificate & provisioning profile
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          CERT_PW: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KC_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KC_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PW" "$KEYCHAIN"
          # Put our keychain first in the search list (keep the login keychain too).
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed 's/"//g')

          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo "$CERT_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN" -P "$CERT_PW" \
            -T /usr/bin/codesign -T /usr/bin/security -f pkcs12
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KC_PW" "$KEYCHAIN" >/dev/null

          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | awk -F\" 'NR==1{print $2}')"
          if [ -z "$IDENTITY" ]; then
            echo "::error::No code-signing identity found in the imported .p12. Is IOS_DIST_CERT_P12 an 'Apple Distribution' cert exported WITH its private key, and IOS_DIST_CERT_PASSWORD its export password?"
            exit 1
          fi
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

          PROFILE_PATH="$RUNNER_TEMP/app.mobileprovision"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE_PATH"
          PLIST="$(security cms -D -i "$PROFILE_PATH")"
          UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<< "$PLIST")"
          NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' /dev/stdin <<< "$PLIST")"
          DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$DIR"
          cp "$PROFILE_PATH" "$DIR/$UUID.mobileprovision"
          echo "PROFILE_NAME=$NAME" >> "$GITHUB_ENV"
          echo "Imported identity '$IDENTITY' + profile '$NAME' ($UUID)"

      - name: Resolve version args
        id: version
        run: |
          ARGS=""
          if [ -n "${{ inputs.version_name }}" ]; then
            ARGS="$ARGS --build-name=${{ inputs.version_name }}"
          fi
          if [ -n "${{ inputs.build_number }}" ]; then
            ARGS="$ARGS --build-number=${{ inputs.build_number }}"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

      - name: Flutter build (compile + assets, no codesign)
        run: |
          flutter build ios --release --no-codesign ${{ steps.version.outputs.args }} \
            --dart-define=SUPABASE_URL=$SUPABASE_URL \
            --dart-define=SUPABASE_PUBLISHABLE_KEY=$SUPABASE_PUBLISHABLE_KEY \
            --dart-define=TOKEN_API_BASE=$TOKEN_API_BASE \
            --dart-define=GOOGLE_WEB_CLIENT_ID=$GOOGLE_WEB_CLIENT_ID \
            --dart-define=GOOGLE_IOS_CLIENT_ID=$GOOGLE_IOS_CLIENT_ID

      # Reread the compiled binary instead of trusting the flags above. A
      # define silently dropped here produces a build that installs, opens,
      # and cannot log in - which is how the Android AAB reached Google Play
      # and got the app suspended. Fails the job before anything is signed.
      - name: Verify the compiled client config
        run: ./scripts/verify-release.sh build/ios/iphoneos/Runner.app

      - name: Xcode archive (manual signing, no cert creation)
        working-directory: ios
        run: |
          xcodebuild archive \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"

      - name: Write export options (manual)
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          EOF
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Export .ipa
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Upload .ipa as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: swayco-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload to App Store Connect / TestFlight
        if: ${{ inputs.upload_to_testflight }}
        run: |
          sed 's#<string>export</string>#<string>upload</string>#' \
            "$RUNNER_TEMP/ExportOptions.plist" > "$RUNNER_TEMP/UploadOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Runner.xcarchive" \
            -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/UploadOptions.plist" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Clean up
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/dist.p12"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
