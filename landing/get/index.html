<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Swayco</title>
<meta name="theme-color" content="#0A0F1C">
<link rel="icon" type="image/png" href="../assets/img/favicon.png">
<link rel="stylesheet" href="../assets/style.css?v=0c71fa43">
<style>
.get{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px 24px;position:relative;overflow:hidden}
.get .glow{top:-260px}
.get-card{position:relative;z-index:1;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:14px}
.get-icon{width:104px;height:104px;border-radius:26px;box-shadow:0 14px 40px rgba(43,127,255,.45)}
.get h1{margin:10px 0 0;font-family:'Unbounded',sans-serif;font-weight:800;font-size:28px;letter-spacing:-.04em}
.get p{margin:0 0 10px;font-size:16px;line-height:1.5;color:rgba(245,247,255,.78)}
.get-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:58px;border-radius:18px;font-weight:800;font-size:17px;font-family:inherit;border:0;cursor:pointer}
.get-btn.main{background:var(--yellow);color:var(--navy)}
.get-btn.main:hover{color:var(--navy);filter:brightness(1.05)}
.get-btn.alt{background:#fff;color:var(--navy)}
.get-btn svg{width:22px;height:22px;fill:currentColor}
.get-hint{margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14);font-size:13.5px;line-height:1.55;color:rgba(245,247,255,.7)}
.get-hint b{color:var(--yellow);font-weight:700}
.get [hidden]{display:none}
</style>
</head>
<body>
<main class="get">
<div class="glow"></div>
<div class="get-card">

  <p id="s">Rencontre des gens partout dans le monde et parle avec la traduction en direct.</p>
  <a id="ios" class="get-btn main" href="https://apps.apple.com/fr/app/swayco-appel-traduction-live/id6774043368" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg><span id="ios-t">Ouvrir dans l'App Store</span></a>
  <a id="and" class="get-btn main" href="https://play.google.com/store/apps/details?id=com.translate.livekit.livekit_translate" rel="noopener" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><span id="and-t">Ouvrir sur Google Play</span></a>
  <button id="copy" class="get-btn alt" type="button">Copier le lien</button>

</div>
</main>
<script>
(function(){
var IOS={fr:"https://apps.apple.com/fr/app/swayco-appel-traduction-live/id6774043368",other:"https://apps.apple.com/app/swayco-appel-traduction-live/id6774043368"},ANDROID="https://play.google.com/store/apps/details?id=com.translate.livekit.livekit_translate";
var L={
 fr:{t:"Télécharge Swayco",s:"Rencontre des gens partout dans le monde et parle avec la traduction en direct.",i:"Ouvrir dans l'App Store",a:"Ouvrir sur Google Play",c:"Copier le lien",d:"Lien copié ✓",h:"Le bouton ne marche pas ? Touche <b>⋯</b> en haut à droite puis choisis <b>« Ouvrir dans le navigateur externe »</b>."},
 en:{t:"Get Swayco",s:"Meet people around the world and talk with live translation.",i:"Open in the App Store",a:"Open on Google Play",c:"Copy link",d:"Link copied ✓",h:"Button not working? Tap <b>⋯</b> at the top right and choose <b>“Open in external browser”</b>."},

};

try{if(!lang)lang=localStorage.getItem("swayco_lang")}catch(e){}
if(!L[lang]){var n=(navigator.language||"fr").toLowerCase();lang=n.indexOf("pt")==0?"pt":n.indexOf("en")==0?"en":"fr"}
var T=L[lang];document.documentElement.lang=lang==="pt"?"pt-BR":lang;
function $(id){return document.getElementById(id)}
$("t").textContent=T.t;$("s").textContent=T.s;$("ios-t").textContent=T.i;$("and-t").textContent=T.a;$("copy").textContent=T.c;$("h").innerHTML=T.h;
document.title=T.t+" — Swayco";
var ua=navigator.userAgent||"",ios=/iPhone|iPad|iPod/.test(ua)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1),android=/Android/.test(ua);
$("ios").href=lang==="fr"?IOS.fr:IOS.other;$("and").href=ANDROID;
// one button for the device; both on a computer
$("ios").hidden=android&&!ios;$("and").hidden=ios||!android&&false;

if(android&&!ios){$("ios").hidden=true;$("and").hidden=false}
$("copy").addEventListener("click",function(){
 var url=location.href,b=this;
 function ok(){b.textContent=T.d;setTimeout(function(){b.textContent=T.c},2200)}
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(url).then(ok,fb)}else fb();
 function fb(){var x=document.createElement("textarea");x.value=url;x.style.position="fixed";x.style.opacity="0";document.body.appendChild(x);x.select();try{document.execCommand("copy");ok()}catch(e){}document.body.removeChild(x)}
});
})();
</script>
</body>
</html>
