<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Télécharger Swayco</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://www.swayco.fr/bienvenue/">
<meta property="og:title" content="Swayco">
<meta property="og:description" content="Appuie ci-dessous pour télécharger l'app.">
<meta property="og:image" content="https://www.swayco.fr/bienvenue/icon-app.png">
<link rel="icon" href="icon-app.png">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#F6F8FE;color:#04123A;font-family:'Plus Jakarta Sans',sans-serif;-webkit-text-size-adjust:100%}
.page{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 28px calc(32px + env(safe-area-inset-bottom));background:radial-gradient(80% 50% at 50% 38%,rgba(43,127,255,.14),rgba(246,248,254,0) 70%)}
.box{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}
.icon{width:96px;height:96px;border-radius:26px;box-shadow:0 18px 40px rgba(31,94,255,.35);display:block}
h1{margin:22px 0 0;font-family:'Unbounded',sans-serif;font-weight:800;font-size:26px;letter-spacing:-.04em}
p.lead{margin:10px 0 0;font-size:16px;line-height:1.5;text-align:center;color:rgba(4,18,58,.72);text-wrap:balance}
a.cta{width:100%;height:56px;margin-top:30px;border-radius:99px;background:linear-gradient(135deg,#1F5EFF,#2B7FFF 55%,#18DDEA);color:#fff;font-weight:800;font-size:16px;text-decoration:none;display:flex;align-items:center;justify-content:center;box-shadow:0 12px 28px rgba(31,94,255,.4)}
button.copy{width:100%;height:52px;margin-top:12px;border-radius:99px;background:#fff;border:1px solid rgba(4,18,58,.14);color:#04123A;font:800 15px 'Plus Jakarta Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer}
.ms{font-family:'Material Symbols Rounded';font-size:20px;line-height:1}
hr{width:100%;height:1px;border:0;background:rgba(4,18,58,.1);margin:26px 0 18px}
p.help{margin:0;font-size:13.5px;line-height:1.55;text-align:center;color:rgba(4,18,58,.7);text-wrap:balance}
p.help strong{color:#1F5EFF}
</style>
</head>
<body>
<main class="page">
<div class="box">
<img class="icon" src="icon-app.png" alt="Swayco" width="96" height="96">
<h1>Swayco</h1>
<p class="lead" id="lead">Appuie ci-dessous pour télécharger l'app.</p>
<a class="cta" id="cta" href="https://apps.apple.com/fr/app/swayco-appel-traduction-live/id6774043368" rel="noopener">Ouvrir dans l'App Store</a>
<button class="copy" id="copy" type="button"><span class="ms" id="copyIcon">link</span><span id="copyLabel">Copier le lien</span></button>
<hr>
<p class="help" id="help">Le bouton ne fonctionne pas ? Appuie sur <strong>···</strong> en haut à droite et choisis <strong>« Ouvrir dans le navigateur externe »</strong>.</p>
</div>
</main>
<script>
(function () {
  var IOS_URL = 'https://apps.apple.com/app/swayco-appel-traduction-live/id6774043368', IOS_URL_FR = 'https://apps.apple.com/fr/app/swayco-appel-traduction-live/id6774043368';
  var ANDROID_URL = 'https://play.google.com/store/apps/details?id=com.translate.livekit.livekit_translate';
  var L = {
    fr: { lead: "Appuie ci-dessous pour télécharger l'app.", ios: "Ouvrir dans l'App Store", and: "Ouvrir dans Google Play", copy: 'Copier le lien', done: 'Lien copié',
          help: 'Le bouton ne fonctionne pas ? Appuie sur <strong>···</strong> en haut à droite et choisis <strong>« Ouvrir dans le navigateur externe »</strong>.', title: 'Télécharger Swayco' },
    en: { lead: 'Tap below to download the app.', ios: 'Open in the App Store', and: 'Open in Google Play', copy: 'Copy link', done: 'Link copied',
          help: 'Button not working? Tap <strong>···</strong> at the top right and choose <strong>“Open in external browser”</strong>.', title: 'Get Swayco' },
    pt: { lead: 'Toque abaixo para baixar o app.', ios: 'Abrir na App Store', and: 'Abrir no Google Play', copy: 'Copiar link', done: 'Link copiado',
          help: 'O botão não funciona? Toque em <strong>···</strong> no canto superior direito e escolha <strong>“Abrir no navegador externo”</strong>.', title: 'Baixar o Swayco' }
  };
  var lang = new URLSearchParams(location.search).get('lang');
  try { if (!lang) lang = localStorage.getItem('swayco_lang'); } catch (e) {}
  if (!L[lang]) {
    var nl = (navigator.language || 'fr').toLowerCase();
    lang = nl.indexOf('pt') === 0 ? 'pt' : nl.indexOf('en') === 0 ? 'en' : 'fr';
  }
  var T = L[lang];
  document.documentElement.lang = lang === 'pt' ? 'pt-BR' : lang;
  document.title = T.title;
  document.getElementById('lead').textContent = T.lead;
  document.getElementById('help').innerHTML = T.help;
  document.getElementById('copyLabel').textContent = T.copy;
  var isAndroid = /android/i.test(navigator.userAgent);
  var url = isAndroid ? ANDROID_URL : (lang === 'fr' ? IOS_URL_FR : IOS_URL);
  var cta = document.getElementById('cta');
  cta.href = url;
  cta.textContent = isAndroid ? T.and : T.ios;
  var btn = document.getElementById('copy'), label = document.getElementById('copyLabel'), icon = document.getElementById('copyIcon');
  btn.addEventListener('click', function () {
    var done = function () {
      label.textContent = T.done; icon.textContent = 'check';
      setTimeout(function () { label.textContent = T.copy; icon.textContent = 'link'; }, 1800);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(window.location.href).then(done, done);
    } else {
      var t = document.createElement('textarea'); t.value = window.location.href; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); } catch (e) {} document.body.removeChild(t); done();
    }
  });
})();
</script>
</body>
</html>
