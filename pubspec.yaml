name: livekit_translate
description: Flutter 1:1 LiveKit video calling with secure token backend and hooks for realtime translation.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 6.1.12+183

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # Drapeaux ronds du bouton de langue, en appel. L'emoji drapeau dépend de la
  # police du système (et n'existe pas du tout sous Windows) ; ceux-ci sont des
  # SVG embarqués (flag-icons), rendus à l'identique partout.
  country_flags: ^4.1.2
  livekit_client: 2.7.0
  flutter_webrtc: 1.4.0
  web: ^1.1.0
  http: ^1.6.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  # Push notifications (iOS + Android natifs).
  # firebase_core: bootstraps the SDK from lib/firebase_options.dart.
  # firebase_messaging: ask permission, get FCM token, listen to refreshes.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Open external URLs (Terms, Privacy, support email) — required for
  # store compliance (App Store §5.1.1, Play Data Safety).
  url_launcher: ^6.3.1
  share_plus: ^12.0.2
  # Reads the real app version/build number for the Settings screen.
  package_info_plus: ^8.0.0
  # Call mic capture (record) + in-call / TTS playback (audioplayers).
  # 6.x — required because record_linux 0.7.2 (the latest in the 5.x
  # tree) doesn't implement the streaming API introduced in
  # record_platform_interface 1.4+, breaking the Android release build
  # at kernel_snapshot time. 6.x ships a record_linux that satisfies
  # the new interface; AudioRecorder / RecordConfig / AudioEncoder
  # are unchanged so no app-side migration is needed. 7.x bumps the
  # min Dart SDK to 3.12, which we can't take yet.
  record: ^6.2.1
  audioplayers: ^6.1.0
  # On-device text-to-speech for the in-call chat captions (fallback when the
  # backend /translation/tts endpoint isn't available).
  flutter_tts: ^4.2.0
  path_provider: ^2.1.4
  # Swayco Midnight design — Bricolage Grotesque (titles) + DM Sans (body).
  google_fonts: ^6.2.1
  flutter_local_notifications: ^18.0.1
  # Absolute-instant scheduling for `zonedSchedule` (the onboarding
  # "finish your profile" reminder). Already pulled in transitively by
  # flutter_local_notifications; declared here so the import is first-class.
  timezone: ^0.10.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  flutter_callkit_incoming: ^3.1.1
  # Plays the boot splash Lottie (SplashScreenAnimation).
  lottie: ^3.1.0
  # Renders the official multicolour Google "G" on the login social button
  # (a font IconData can't carry Google's 4 brand colours).
  flutter_svg: ^2.0.0
  # RevenueCat — in-app subscriptions on iOS / Android (the web build keeps
  # using the Stripe checkout via StripeApi; RevenueCat's native SDK has no
  # web support).
  purchases_flutter: ^10.2.2

  # Liquid Glass (iOS 26) on the Messages screen.
  # - cupertino_native_plus: native platform-view glass for the STATIC
  #   "Invite to a call" button (CNButton.glass) on iOS 26+. iOS/macOS only —
  #   every use is guarded behind PlatformVersion.shouldUseNativeGlass, with a
  #   fallback widget so Android / iOS<26 never instantiate it.
  # - liquid_glass_widgets: cross-platform shader glass (incl. web) for the
  #   nav bar and the chat-list card.
  cupertino_native_plus: ^0.0.11
  liquid_glass_widgets: ^0.15.0

  # sherpa_onnx — the single ONNX Runtime the app consolidates on. Drives both
  # on-device TTS (OfflineTts: Kokoro + Piper/VITS, espeak-ng inside each model
  # bundle) and on-device STT (OfflineRecognizer: universal Whisper) plus the
  # VAD segmenter (seg.onnx). It statically links its own runtime, so it must
  # be the ONLY ONNX Runtime in the app — a second one makes iOS fail to link
  # on duplicate symbols. Models stay download-on-demand.
  sherpa_onnx: ^1.13.4

  # On-device STT (lib/swayco/asr): universal Whisper via sherpa_onnx above
  # (OS STT preferred first on iOS/Android). FFI for OpenJTalk / other natives.
  ffi: ^2.1.3
  # TTS voice bundles ship as tar archives.
  archive: ^4.0.7
  # Pinned exactly (not ^9.0.0): 9.1.0 added a non-modular #import of
  # GoogleMobileAds_Beta.h in FLTAd_Internal.h/FLTAdPreloader.h, which fails
  # the iOS Release archive ("Include of non-modular header inside framework
  # module") — a CLANG_ALLOW_NON_MODULAR_INCLUDES_IN_FRAMEWORK_MODULES
  # Podfile workaround does NOT fix it for Release. Un-pin once Google ships
  # a fixed release.
  google_mobile_ads: 9.0.0
  geolocator: ^14.0.2
  geocoding: ^5.0.0

# iOS + macOS: use the sherpa_onnx plugin patched with the ja external-tokens API
# (SherpaOnnxOfflineTtsGenerateFromTokens) and shipping the OpenJTalk reading lib
# alongside it — that pair is what makes the Japanese voice run on the app's
# SINGLE ONNX Runtime (see native/sherpa_ja_patch + native/ja_openjtalk).
# The native binaries are git-ignored; regenerate them with each override's
# setup.sh / build_ios.sh. Android still uses the stock plugin (no ja voice yet).
dependency_overrides:
  sherpa_onnx_macos:
    path: native/sherpa_onnx_macos_patched
  sherpa_onnx_ios:
    path: native/sherpa_onnx_ios_patched

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Drives the real app() on a device — required by everything under
  # integration_test/. It was missing, so that whole suite failed to
  # compile ("Target of URI doesn't exist").
  integration_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # flutter_native_splash retired in 6.1.2+10 — its in-app overlay
  # was never being dismissed in Release builds on real iPhone /
  # Android devices, leaving a pure-black surface over a correctly
  # rendered LoginScreen (confirmed by Railway pings showing
  # `login-screen-build` + `first-frame` while the user only saw
  # black). The iOS LaunchScreen.storyboard and the Android
  # launch_background drawable still display during cold start
  # (they're handled by the OS, not the plugin), so the user keeps
  # the brief logo flash without the broken overlay.
  # Generates the launcher icons (Android / iOS / web) from icon-app.png.
  flutter_launcher_icons: ^0.14.1

# App launcher icon. Regenerate after changing assets/icon-app.png with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon-app.png"
  android: true
  # Android 8+ needs an adaptive icon, drawn on a 108dp canvas of which
  # only the CENTER 72dp is ever shown — the outer ring is clipped
  # outright before any mask shape even runs, on every launcher, no
  # exceptions. Guaranteed-visible content must stay within a 66dp
  # "safe zone" circle (source: Android's adaptive icon spec — see
  # developer.android.com/develop/ui/views/launch/icon_design_adaptive).
  #
  # The whole flat tile used to go in the BACKGROUND layer — logo baked
  # in, edge to edge, foreground left transparent. Measured on
  # icon-app.png: the arrow's tip sits at 85% of the way to the edge,
  # more than double the 61% (33dp of 54dp half-canvas) the safe zone
  # actually guarantees. Every real device was cropping the tip clean
  # off, and what stayed on screen read as a zoomed-in, cropped logo —
  # "the icon looks too big" once installed from the store, though the
  # flat 1024×1024 preview (and the separate 512×512 Play Store listing
  # icon, assets/icon-android.png — untouched, uploaded by hand, not
  # part of this pipeline) looked perfectly normal.
  #
  # Split in two, as adaptive icons are meant to be: icon-adaptive-bg.png
  # is the gradient ALONE, still edge to edge — a plain fill is exactly
  # what is safe to bleed into the clipped ring. icon-adaptive-fg.png is
  # the white logo ALONE, transparent elsewhere, rescaled so its
  # farthest point sits at 30% of canvas width from centre — inside the
  # 30.6% safe-zone radius, not merely inside the 33% viewport crop.
  adaptive_icon_background: "assets/icon-adaptive-bg.png"
  adaptive_icon_foreground: "assets/icon-adaptive-fg.png"
  ios: true
  # iOS icons may not carry transparency — flatten the rounded-corner
  # alpha onto the icon's own near-black background.
  remove_alpha_ios: true
  background_color_ios: "#000000"
  web:
    generate: true
    image_path: "assets/icon-app.png"
    background_color: "#000000"
    theme_color: "#00A884"

# flutter_native_splash config retired in 6.1.2+10. See the
# `dev_dependencies` comment above for the diagnosis.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    # Illustration shown in the "add your photo" profile tip dialog.
    - assets/add-picture.png
    # Group-selfie photo heading the onboarding welcome step.
    - assets/bienvenue.jpg
    # Cyan Ø brand mark (cropped from test-logo.png).
    - assets/test-logo.png
    # Transparent Ø-arrows mark — call connecting splash ("sas").
    - assets/icon-saas.png
    # Boot splash — Splash Sync Call "cassure nette" (same file as web/splash.json).
    - assets/splash.json
    # Discover globe filter — "Go" transition (Ring+Arrow, no wordmark).
    - assets/discover_filter_transition.json
    # Official multicolour Google "G" — login "Continue with Google" button.
    - assets/google-logo-search-new-svgrepo-com.svg
    # Short chime played when the "It's a match" badge pops.
    - assets/sounds/match_pop.wav
    # Nav-bar glyphs drawn as SVG (the Discover coconut).
    - assets/icons/
    # Preview photo in the "Léa veut t'ajouter" onboarding tip card.
    - assets/tips/lea_preview.jpg
    # Natural Earth 110m country outlines (GeoJSON, coords rounded to 2dp) —
    # drives the Discover country-picker globe (lib/widgets/discover_globe.dart).
    - assets/geo/world-110m.geo.json

  # The swaycø wordmark is set in Glacial Indifference (SIL Open Font
  # License — see assets/fonts/OFL.txt). Brand type only: the rest of the UI
  # stays on Bricolage Grotesque / DM Sans via google_fonts.
  fonts:
    - family: GlacialIndifference
      fonts:
        - asset: assets/fonts/GlacialIndifference-Regular.ttf
        - asset: assets/fonts/GlacialIndifference-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
