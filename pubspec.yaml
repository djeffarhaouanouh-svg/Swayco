name: livekit_translate
description: Flutter 1:1 LiveKit video calling with secure token backend and hooks for realtime translation.
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 6.1.2+16

environment:
  sdk: ^3.11.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  # DIAGNOSTIC BUILD 6.1.2+8: livekit_client and flutter_webrtc are
  # commented out so their native plugins are NOT registered at engine
  # init on iOS / Android. This is the only test that isolates whether
  # those plugins' native registration is what hangs the Release build
  # on a real device. Restore both lines once the diagnostic proves
  # (or rules out) the hypothesis. Stubs in lib/translation/ and
  # lib/screens/call_screen.dart keep the rest of the code compiling.
  # livekit_client: 2.7.0
  # flutter_webrtc: 1.4.0
  web: ^1.1.0
  http: ^1.6.0
  permission_handler: ^12.0.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.8.0
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  # Push notifications (iOS + Android natifs).
  # firebase_core: bootstraps the SDK from lib/firebase_options.dart.
  # firebase_messaging: ask permission, get FCM token, listen to refreshes.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Open external URLs (Terms, Privacy, support email) — required for
  # store compliance (App Store §5.1.1, Play Data Safety).
  url_launcher: ^6.3.1
  share_plus: ^12.0.2
  # Reads the real app version/build number for the Settings screen.
  package_info_plus: ^8.0.0
  # Voice messages: record on iOS/Android/web (AAC/m4a + WebM on web),
  # play back the original recording on the receiving end. Both packages
  # request mic / playback permissions through permission_handler above.
  # 6.x — required because record_linux 0.7.2 (the latest in the 5.x
  # tree) doesn't implement the streaming API introduced in
  # record_platform_interface 1.4+, breaking the Android release build
  # at kernel_snapshot time. 6.x ships a record_linux that satisfies
  # the new interface; AudioRecorder / RecordConfig / AudioEncoder
  # are unchanged so no app-side migration is needed. 7.x bumps the
  # min Dart SDK to 3.12, which we can't take yet.
  record: ^6.2.1
  audioplayers: ^6.1.0
  path_provider: ^2.1.4
  # Swayco Midnight design — Bricolage Grotesque (titles) + DM Sans (body).
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  # flutter_native_splash retired in 6.1.2+10 — its in-app overlay
  # was never being dismissed in Release builds on real iPhone /
  # Android devices, leaving a pure-black surface over a correctly
  # rendered LoginScreen (confirmed by Railway pings showing
  # `login-screen-build` + `first-frame` while the user only saw
  # black). The iOS LaunchScreen.storyboard and the Android
  # launch_background drawable still display during cold start
  # (they're handled by the OS, not the plugin), so the user keeps
  # the brief logo flash without the broken overlay.
  # Generates the launcher icons (Android / iOS / web) from icon-swayco.png.
  flutter_launcher_icons: ^0.14.1

# App launcher icon. Regenerate after changing assets/icon-app.png with:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon-app.png"
  android: true
  # Android 8+ needs an adaptive icon. The whole tile goes in the
  # BACKGROUND layer, which fills the icon edge to edge with no inset —
  # so the tile fills whatever mask shape the launcher applies, instead
  # of floating as a small square. The foreground layer is left
  # transparent (the plugin still requires one).
  adaptive_icon_background: "assets/icon-app.png"
  adaptive_icon_foreground: "assets/icon-fg-transparent.png"
  ios: true
  # iOS icons may not carry transparency — flatten the rounded-corner
  # alpha onto the icon's own near-black background.
  remove_alpha_ios: true
  background_color_ios: "#000000"
  web:
    generate: true
    image_path: "assets/icon-app.png"
    background_color: "#000000"
    theme_color: "#00A884"

# flutter_native_splash config retired in 6.1.2+10. See the
# `dev_dependencies` comment above for the diagnosis.

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/demo_profile.png
    - assets/test-splashscreen.png
    # Swayco Midnight ambient background — used by MeshBackground.
    - assets/mesh_midnight_bg.png
    # Illustration shown in the "add your photo" profile tip dialog.
    - assets/add-picture.png

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
