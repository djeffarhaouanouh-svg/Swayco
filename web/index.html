<!DOCTYPE html><html><head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Appels vidéo traduits en direct.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Swayco">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>Swayco</title>
  <link rel="manifest" href="manifest.json">

  <!-- Preload the on-device VAD model + ONNX runtime in the background so the
       first call's speech recognition is ready immediately, instead of these
       ~megabytes only starting to download once the call has connected (which
       is why the first seconds of a call used to miss speech). Warms the
       browser cache; harmless if no call is ever made. crossorigin matches the
       CORS fetch the VAD/ORT actually use, so the cached bytes get reused. -->
  <link rel="prefetch" as="fetch" crossorigin href="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/silero_vad_v5.onnx">
  <link rel="prefetch" as="fetch" crossorigin href="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/vad.worklet.bundle.min.js">
  <link rel="prefetch" as="fetch" crossorigin href="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort-wasm-simd-threaded.jsep.wasm">
  <link rel="prefetch" as="fetch" crossorigin href="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort-wasm-simd-threaded.jsep.mjs">
  
  
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
  
  
  <style id="splash-screen-style">
    html {
      height: 100%;
      background-color: #0E0E0E;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0E0E0E;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #0E0E0E;
          }
    }

    /* Boot splash: full splash_screen.png art (gradient + coconut). */
    #splash {
      position: fixed;
      inset: 0;
      margin: 0;
      background: linear-gradient(180deg, #DEFCF9 0%, #48EEDD 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      z-index: 2147483647;
    }
    #splash-art {
      width: max(100vw, 100vh);
      height: max(100vw, 100vh);
      object-fit: cover;
    }
  </style>

  <!--
    TEST — non-streaming STT (Silero VAD + Whisper). WEB ONLY, TO BE REVERTED.
    Silero v5 through @ricky0123/vad-web: it segments the live mic and hands us
    one clean utterance per phrase, which we send to Whisper. Loaded from the CDN
    on purpose — a throwaway experiment shouldn't drop ~3 MB of .onnx/.wasm blobs
    into the repo. Deleting these two tags is most of the revert.
    Exposes window.vad. Versions pinned: the ORT build and the VAD bundle must
    agree or the worklet fails to instantiate.
  -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.wasm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@ricky0123/vad-web@0.0.29/dist/bundle.min.js"></script>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "#0E0E0E";
    }
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
    window.setTimeout(removeSplashFromWeb, 15000);
  </script>
</head>
<body>
  <div id="splash">
    <img id="splash-art" src="icons/splash_screen.png" alt="" />
  </div>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>

  <!-- Eruda mobile console — only loads when ?debug=1 is in the URL.
       On iPhone: open https://www.swayco.fr/?debug=1 to see JS + Flutter logs. -->
  <script>
    if (window.location.search.includes('debug=1') || window.location.hostname === 'localhost') {
      var _e = document.createElement('script');
      _e.src = 'https://cdn.jsdelivr.net/npm/eruda';
      _e.onload = function() { eruda.init(); };
      document.head.appendChild(_e);
    }
  </script>

</body></html>
