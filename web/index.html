  <style id="splash-screen-style">
    html {
      height: 100%;
      background-color: #000000;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #000000;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #000000;
          }
    }

    /* Boot splash: the Traduction.json Lottie, centred on pure black.
       Shown immediately while the Flutter engine downloads + boots, then
       removed by removeSplashFromWeb() once the first Flutter frame renders
       (the in-app SplashScreenAnimation plays the SAME Lottie, so the hand-off
       is invisible). */
    #splash {
      position: fixed;
      inset: 0;
      margin: 0;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2147483647;
    }
    #splash-lottie {
      width: min(80vmin, 500px);
      height: min(80vmin, 500px);
    }
  </style>
  <!-- Lottie player (vendored, offline-safe) for the boot splash above. -->
  <script src="lottie.min.js"></script>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      try { window.__splashAnim?.destroy(); } catch (e) {}
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      // Stay deep black behind Flutter (no white flash on first frame).
      document.body.style.background = "#000000";
    }
    // Flutter fires "flutter-first-frame" once its first frame is painted —
    // that's our cue to pull the HTML boot splash so the (identical) in-app
    // Lottie shows through. WITHOUT this, the #splash overlay (z-index max)
    // covers the running app forever (flutter_native_splash, which used to
    // call removeSplashFromWeb, was retired). The timeout is a backstop in
    // case the event never fires.
    window.addEventListener("flutter-first-frame", removeSplashFromWeb);
    window.setTimeout(removeSplashFromWeb, 15000);
  </script>
</head>
<body>
  <!-- Boot splash: the Traduction.json Lottie animation on deep black. This is
       the very first image on web; removeSplashFromWeb() removes it once the
       Flutter first frame is up. -->
  <div id="splash">
    <div id="splash-lottie"></div>
  </div>
  <script>
    (function () {
      try {
        if (window.lottie) {
          window.__splashAnim = lottie.loadAnimation({
            container: document.getElementById("splash-lottie"),
            renderer: "svg",
            loop: true,
            autoplay: true,
            path: "Traduction.json",
          });
        }
      } catch (e) {
        // If Lottie fails to load, the deep-black #splash background remains,
        // which is exactly the previous boot look — no white flash.
      }
    })();
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.

    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async=""></script>

  <!-- Eruda mobile console — only loads when ?debug=1 is in the URL.
       On iPhone: open https://www.swayco.fr/?debug=1 to see JS + Flutter logs. -->
  <script>
    if (window.location.search.includes('debug=1') || window.location.hostname === 'localhost') {
      var _e = document.createElement('script');
      _e.src = 'https://cdn.jsdelivr.net/npm/eruda';
      _e.onload = function() { eruda.init(); };
      document.head.appendChild(_e);
    }
  </script>

</body></html>
